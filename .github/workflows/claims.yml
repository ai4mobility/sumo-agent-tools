name: claim tests

on:
  push:
  pull_request:

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install eclipse-sumo==1.28.0 traci==1.28.0 sumolib==1.28.0 pyproj rtree
      - run: python test_claims.py
